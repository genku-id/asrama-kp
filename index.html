<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASRAMA KULON PROGO</title>
    
    <!-- Meta Tags for Thumbnail / Share Link -->
    <meta property="og:title" content="Aplikasi Absensi Asrama Kulon Progo" />
    <meta property="og:description" content="Sistem absensi berbasis QR Code untuk Asrama Mahasiswa Kulon Progo." />
    <meta property="og:image" content="https://asrama-kp.vercel.app/logo.jpg" />
    <meta property="og:url" content="https://asrama-kp.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        html, body { height: 100%; height: -webkit-fill-available; overflow: hidden; width: 100%; position: fixed; top: 0; left: 0; }
        body { font-family: "Inter", sans-serif; background-color: #f3f4f6;}
        .mobile-container { max-width: 480px; width: 100%; height: 100%; margin: 0 auto; background: #fbfbfa; position: relative; display: flex; flex-direction: column; overflow: hidden;}
        [x-cloak] { display: none !important; }

        @media print {
            html, body { position: static !important; overflow: visible !important; height: auto !important; width: auto !important; }
            body, .mobile-container { overflow: visible !important; height: auto !important; background: white !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
            header, nav, button, .print-hide { display: none !important; }
            main, #currentTab { padding: 0 !important; margin: 0 !important; overflow: visible !important; display: block !important; }
            @page { margin: 10mm; size: portrait; }
        }
        
        /* CSS to support HTML5-QRCode */
        #reader { width: 100%; height: 100%; position: relative; }
        #reader video, #reader canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
            position: absolute !important; 
            top: 0; left: 0; 
        }
    </style>
</head>
<body class="antialiased bg-gray-100 flex justify-center">
    <div class="mobile-container shadow-2xl bg-gray-50 flex flex-col relative" x-data="asramaApp()">
        
        <!-- HEADER -->
        <header class="p-4 border-b bg-white z-10 flex justify-between items-center shadow-sm shrink-0">
            <div>
                <h1 class="text-lg font-bold text-gray-800">ASRAMA KP</h1>
                <p class="text-[11px] text-gray-500">Sistem Absensi Digital</p>
            </div>
            <div>
                <button @click="toggleLogin()" class="p-2 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
                    <svg x-show="!isPanitia" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <svg x-show="isPanitia" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" x-cloak>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-grow p-4 overflow-y-auto space-y-4" x-cloak>
            
            <!-- TAB SCAN (BERANDA) -->
            <div x-show="currentTab === 'scan'" class="space-y-4 mt-6">
                <template x-if="!isPanitia">
                    <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-100 text-center">
                        <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <h2 class="text-xl font-bold text-gray-700 mb-2">Selamat Datang!</h2>
                        <p class="text-sm text-gray-500 mb-6">Silakan login sebagai panitia untuk memindai kehadiran peserta.</p>
                        <button @click="toggleLogin()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md">LOGIN PANITIA</button>
                    </div>
                </template>
                <template x-if="isPanitia">
                    <div class="space-y-4">
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm">
                            <p class="text-[11px] font-bold text-blue-500 mb-2 uppercase tracking-wide">PENGATURAN SESI SEKARANG</p>
                            <div class="flex gap-2 items-center">
                                <select x-model="activeSesi" @change="window.updateSesiKeDatabase(activeSesi)" :disabled="sessionLocked" class="flex-grow p-2.5 rounded-xl border-none outline-none ring-1 ring-blue-200 bg-white font-bold text-gray-700 text-sm focus:ring-2 focus:ring-blue-400">
                                    <option value="Sesi 1">JUM'AT MLM</option>
                                    <option value="Sesi 2">SABTU SUBUH</option>
                                    <option value="Sesi 3">SABTU PAGI 1</option>
                                    <option value="Sesi 4">SABTU PAGI 2</option>
                                    <option value="Sesi 5">SABTU SIANG</option>
                                    <option value="Sesi 6">SABTU MLM</option>
                                    <option value="Sesi 7">MINGGU SUBUH</option>
                                    <option value="Sesi 8">MINGGU PAGI</option>
                                </select>
                                <button @click="toggleLock()" class="p-2.5 bg-white rounded-xl shadow-sm border border-blue-100 flex-shrink-0 transition-all hover:bg-gray-50">
                                    <svg x-show="sessionLocked" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                    <svg x-show="!sessionLocked" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
                                </button>
                            </div>
                        </div>
                        <button @click="mulaiScanner()" class="w-full h-36 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl shadow-xl flex flex-col items-center justify-center text-white active:scale-95 transition-transform overflow-hidden relative">
                            <div class="absolute inset-0 bg-white opacity-5 rounded-2xl"></div>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span class="font-bold text-lg tracking-wide drop-shadow-md">SCAN SEKARANG</span>
                        </button>
                        
                        <!-- MANUAL INPUT -->
                        <div class="mt-2 bg-gray-50 p-4 rounded-2xl border border-gray-200">
                            <p class="text-[11px] font-bold text-gray-500 mb-2 uppercase tracking-wide">Atau Input Manual</p>
                            <div class="flex gap-2">
                                <input type="text" id="manualInput" list="manualOptions" placeholder="Ketik nama kelompok..." class="flex-grow p-2.5 rounded-xl border border-gray-300 bg-white font-bold text-gray-700 text-sm focus:ring-2 focus:ring-blue-400" autocomplete="off">
                                <datalist id="manualOptions"></datalist>
                                <button onclick="window.submitManual()" class="px-4 py-2.5 bg-gray-800 text-white rounded-xl shadow-sm hover:bg-gray-900 active:scale-95 transition-transform font-bold text-sm">
                                    KIRIM
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- TAB REKAP -->
            <div x-show="currentTab === 'rekap'" class="space-y-4">
                <template x-if="!isPanitia">
                    <div class="text-center p-6 text-gray-500 mt-10">Anda harus login untuk melihat rekap.</div>
                </template>
                <template x-if="isPanitia">
                    <div class="space-y-4">
                        <div class="flex gap-2 print-hide">
                            <button @click="showTime = !showTime" class="flex-grow p-3 bg-gray-800 text-white rounded-xl shadow-md hover:bg-gray-900 active:scale-95 transition-all font-bold text-xs flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                <span x-text="showTime ? 'SEMBUNYIKAN WAKTU' : 'TAMPILKAN WAKTU'"></span>
                            </button>
                            <button id="btn-share" @click="window.shareLaporanWA(JSON.parse(JSON.stringify(rekapData)), showTime)" class="flex-grow p-3 bg-green-600 text-white rounded-xl shadow-md hover:bg-green-700 active:scale-95 transition-all font-bold text-xs flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                                SHARE
                            </button>
                            <button @click="window.print()" class="p-3 bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition-all font-bold text-xs flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                                CETAK
                            </button>
                        </div>
                        <h2 class="hidden print:block text-center text-lg font-extrabold mb-4 mt-2 text-gray-800 uppercase tracking-wide">Rekapitulasi Kehadiran Asrama Kulon Progo</h2>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto print:overflow-visible print:border-none print:shadow-none mb-10">
                            <table class="w-full text-left text-[10px] sm:text-xs whitespace-nowrap">
                                <thead class="bg-indigo-50 text-indigo-800 border-b border-indigo-100">
                                    <tr>
                                        <th class="px-2 py-2 border-r border-indigo-100">Desa</th>
                                        <th class="px-2 py-2 border-r border-indigo-100">Kelompok</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Jum'at Mlm</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Sabtu Subuh</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Sabtu Pagi 1</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Sabtu Pagi 2</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Sabtu Siang</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Sabtu Mlm</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Minggu Subuh</th>
                                        <th class="p-3 text-center border-l border-indigo-100">Minggu Pagi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <template x-for="(row, index) in rekapData" :key="index">
                                        <tr class="hover:bg-blue-50 transition-colors" :class="(index % 2 === 0) ? 'bg-white' : 'bg-gray-50'" :style="index === 31 ? 'page-break-before: always; break-before: page;' : ''">
                                            <td class="px-2 py-1.5 border-r border-gray-100" x-text="row.daerah"></td>
                                            <td class="px-2 py-1.5 border-r border-gray-100 font-bold text-gray-800" x-text="row.nama"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi1 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi1 !== '-' ? (showTime ? row.sesi1 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi2 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi2 !== '-' ? (showTime ? row.sesi2 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi3 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi3 !== '-' ? (showTime ? row.sesi3 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi4 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi4 !== '-' ? (showTime ? row.sesi4 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi5 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi5 !== '-' ? (showTime ? row.sesi5 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi6 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi6 !== '-' ? (showTime ? row.sesi6 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi7 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi7 !== '-' ? (showTime ? row.sesi7 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                            <td class="p-3 text-center border-l border-gray-100 font-bold" :class="row.sesi8 !== '-' ? 'text-green-600' : 'text-gray-300'" x-html="row.sesi8 !== '-' ? (showTime ? row.sesi8 : '<span class=\'text-lg leading-none\'>✔</span>') : '-'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <button @click="resetData()" class="w-full mt-4 p-3 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 font-bold text-xs rounded-xl transition-colors flex justify-center items-center gap-2 print-hide cursor-pointer active:scale-95 z-50 relative">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            RESET / HAPUS SEMUA DATA ABSENSI
                        </button>
                    </div>
                </template>
            </div>

            <!-- TAB GENERATOR KARTU -->
            <div x-show="currentTab === 'kartu'" class="space-y-4">
                <template x-if="!isPanitia">
                    <div class="text-center p-6 text-gray-500 mt-10">Anda harus login untuk mengakses fitur ini.</div>
                </template>
                <template x-if="isPanitia">
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                            <div class="bg-indigo-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-indigo-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </div>
                            <h2 class="font-bold text-lg text-gray-800 mb-1">Kartu Peserta</h2>
                            <p class="text-[11px] text-gray-500 mb-5 leading-relaxed">Sistem akan membuat 62 QR Code khusus untuk 31 Kelompok Asrama, lengkap dengan nama kelompok di bawah barcode.</p>
                            <button @click="generateSemuaKartu()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-colors">BUAT 62 KARTU SEKARANG</button>
                        </div>
                        
                        <div id="tempat-kartu" class="flex flex-col gap-6 items-center w-full"></div>
                    </div>
                </template>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="w-full bg-white border-t border-gray-200 flex justify-around items-center px-2 py-1 shadow-[0_-5px_15px_rgba(0,0,0,0.03)] z-20 shrink-0" style="padding-bottom: env(safe-area-inset-bottom, 8px);">
            <button @click="currentTab = 'scan'" class="flex flex-col items-center justify-center p-2 w-20 transition-colors" :class="currentTab === 'scan' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" :stroke-width="currentTab === 'scan' ? '2.5' : '2'"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
                <span class="text-[10px] font-semibold mt-1">Scan</span>
            </button>
            <button @click="currentTab = 'rekap'; fetchRekap();" class="flex flex-col items-center justify-center p-2 w-20 transition-colors" :class="currentTab === 'rekap' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" :stroke-width="currentTab === 'rekap' ? '2.5' : '2'"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span class="text-[10px] font-semibold mt-1">Rekap</span>
            </button>
            <button @click="currentTab = 'kartu'" class="flex flex-col items-center justify-center p-2 w-20 transition-colors" :class="currentTab === 'kartu' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" :stroke-width="currentTab === 'kartu' ? '2.5' : '2'"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="text-[10px] font-semibold mt-1">Kartu</span>
            </button>
        </nav>

        <!-- LOGIN MODAL -->
        <div x-show="showLoginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 backdrop-blur-sm" x-cloak>
            <div class="bg-white p-6 rounded-2xl w-[90%] max-w-sm shadow-2xl scale-100 transition-transform" @click.outside="showLoginModal = false">
                <h3 class="text-lg font-bold text-gray-800 mb-2">Login Panitia</h3>
                <p class="text-xs text-gray-500 mb-5">Masukkan sandi khusus panitia.</p>
                <input type="password" x-model="passwordInput" placeholder="Sandi (123)" class="w-full p-3.5 border border-gray-200 bg-gray-50 rounded-xl mb-5 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none font-semibold text-center text-lg tracking-widest">
                <div class="flex gap-3">
                    <button @click="showLoginModal = false" class="flex-1 p-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Batal</button>
                    <button @click="doLogin()" class="flex-1 p-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors">Masuk</button>
                </div>
            </div>
        </div>

        <!-- SCANNER SECTION (FULLSCREEN) -->
        <div id="scanner-section" class="hidden absolute inset-0 z-[1000] bg-black flex flex-col items-center justify-center">
            <div class="absolute top-4 w-full flex justify-between items-center px-4 z-10">
                <span class="bg-black bg-opacity-50 text-white text-xs px-3 py-1 rounded-full font-semibold border border-white border-opacity-20 backdrop-blur-sm" id="scanner-status">Memulai Kamera...</span>
                <button id="btn-pindah-kamera" class="bg-black bg-opacity-50 text-white p-2 rounded-full border border-white border-opacity-20 backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
            </div>
            
            <div id="reader" class="w-full h-full flex items-center justify-center bg-black"></div>
            
            <div class="absolute bottom-10 w-full flex justify-center z-10">
                <button onclick="window.stopScanner()" class="px-8 py-3.5 bg-red-600 bg-opacity-90 hover:bg-red-700 text-white font-bold text-sm tracking-wider rounded-full shadow-[0_4px_20px_rgba(220,38,38,0.5)] backdrop-blur-sm transition-transform active:scale-95 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l18 18"/></svg>
                    TUTUP KAMERA
                </button>
            </div>
        </div>

        <!-- SUCCESS OVERLAY (FULLSCREEN) -->
        <div id="success-overlay" onclick="window.tutupSukses()" class="hidden absolute inset-0 z-[9999] bg-gradient-to-b from-blue-500 to-indigo-700 flex flex-col justify-center items-center text-white text-center p-6 shadow-2xl cursor-pointer">
            <div class="animate-bounce mb-4 bg-white bg-opacity-20 p-4 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <p class="text-xs font-semibold mb-3 text-blue-100 uppercase tracking-widest opacity-80">Alhamdulillah Jazaa Kumullahu Koiroo</p>
            <h1 id="sukses-nama" class="text-3xl font-black uppercase mb-1 leading-tight text-white drop-shadow-md">NAMA</h1>
            <h2 id="sukses-kelompok" class="text-xl text-yellow-300 font-bold uppercase mb-8 drop-shadow-sm">KELOMPOK</h2>
            <div class="bg-white bg-opacity-10 px-6 py-3 rounded-2xl border border-white border-opacity-20 backdrop-blur-sm inline-block mb-10">
                <p id="sukses-sesi" class="text-lg font-bold">SESI AKTIF</p>
            </div>
            <button class="px-6 py-2 rounded-full border-2 border-white border-opacity-50 text-white font-bold text-sm tracking-wider opacity-80 hover:bg-white hover:text-blue-600 transition-colors">TUTUP / LANJUT SCAN</button>
            <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
        </div>

    </div>

    <script type="module" src="app.js?v=42"></script>
    <script>
        function asramaApp() {
            return {
                currentTab: 'scan', // scan, rekap, kartu
                isPanitia: localStorage.getItem('isPanitia') === 'true',
                activeSesi: 'Sesi 1',
                sessionLocked: false,
                showLoginModal: false,
                passwordInput: '',
                showTime: false,
                rekapData: [],
                
                init() {
                    // Make alpine variables accessible to global scope (app.js)
                    window.alpineApp = this;
                    if(this.isPanitia) {
                        this.fetchRekap();
                    }
                },
                
                toggleLogin() {
                    if (this.isPanitia) {
                        if(confirm('Apakah Anda yakin ingin logout?')) {
                            localStorage.removeItem('isPanitia');
                            this.isPanitia = false;
                            this.currentTab = 'scan';
                        }
                    } else {
                        this.showLoginModal = true;
                    }
                },
                
                doLogin() {
                    if (this.passwordInput === '123') {
                        localStorage.setItem('isPanitia', 'true');
                        this.isPanitia = true;
                        this.showLoginModal = false;
                        this.passwordInput = '';
                        // Default lock off when fresh login
                        this.sessionLocked = false;
                        localStorage.removeItem('sessionLocked');
                        this.fetchRekap();
                    } else {
                        alert('Sandi salah!');
                    }
                },
                
                toggleLock() {
                    this.sessionLocked = !this.sessionLocked;
                    if(window.updateLockKeDatabase) {
                        window.updateLockKeDatabase(this.sessionLocked);
                    }
                    if(this.sessionLocked && window.updateSesiKeDatabase) {
                        window.updateSesiKeDatabase(this.activeSesi);
                    }
                },
                
                mulaiScanner() {
                    if (window.jalankanScannerApp) {
                        window.jalankanScannerApp();
                    } else {
                        alert("Sistem scanner belum dimuat!");
                    }
                },

                fetchRekap() {
                    if (window.subscribeRekapData) {
                        if (this.unsubscribeRekap) this.unsubscribeRekap();
                        this.unsubscribeRekap = window.subscribeRekapData((data) => {
                            this.rekapData = data;
                        });
                    }
                },

                generateSemuaKartu() {
                    if (window.generateKartuSemuaKelompok) {
                        window.generateKartuSemuaKelompok();
                    }
                },

                resetData() {
                    if (window.resetSemuaDataAbsensi) {
                        window.resetSemuaDataAbsensi();
                    } else {
                        alert("Fungsi reset belum dimuat dengan sempurna, silakan refresh halaman.");
                    }
                }
            }
        }
    </script>
